name: Validate Axo-App

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test border beam
        run: npm test

      - name: Upload visual test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: border-beam-report
          path: playwright-report/
          retention-days: 14

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
