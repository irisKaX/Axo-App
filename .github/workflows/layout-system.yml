name: Verify Axolotl Layout System

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify shared layouts and responsive tool integration
        run: npm test -- tests/layout-system.spec.ts --timeout=30000
      - name: Build and check strict types
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Upload layout screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axolotl-layout-verification
          path: |
            playwright-report/
            test-results/
            docs/layout-system/screenshots/
          retention-days: 14
