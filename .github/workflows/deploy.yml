name: Deploy Axo-App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Never cancel an in-flight Pages publication when another commit arrives.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npx vite build
        env:
          GITHUB_PAGES: 'true'

      # Build a separate copy of the design branch under /preview/converter/.
      # Root site remains built from main; no draft UI is merged or shipped at /.
      - name: Build isolated converter design preview
        shell: bash
        run: |
          git fetch --depth=1 origin design/converter-precision-pass
          git worktree add --detach "$RUNNER_TEMP/axo-converter-preview" FETCH_HEAD
          cd "$RUNNER_TEMP/axo-converter-preview"
          npm ci --no-audit --no-fund
          npx vite build --base /Axo-App/preview/converter/ --outDir "$GITHUB_WORKSPACE/dist/preview/converter"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
